name: Cross-platform Strut regressions

on:
  workflow_dispatch:
    inputs:
      compiler_ref:
        description: strut compiler git ref
        required: false
        default: main

jobs:
  regressions:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
          - os: windows-2022
            name: windows-x64
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout regression suite
        uses: actions/checkout@v5
        with:
          path: strut-regression-suite
      - name: Checkout compiler
        uses: actions/checkout@v5
        with:
          repository: strut-labs/strut
          ref: ${{ inputs.compiler_ref || 'main' }}
          path: strut
      - name: Enable MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install generated-program dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libcurl4-openssl-dev libssl-dev libsqlite3-dev
      - name: Install generated-program dependencies (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install openssl@3
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"
          echo "CPATH=$(brew --prefix openssl@3)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix openssl@3)/lib" >> "$GITHUB_ENV"
      - name: Install generated-program dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install curl:x64-windows sqlite3:x64-windows openssl:x64-windows
          $vcpkgRoot = Split-Path -Parent (Get-Command vcpkg).Source
          $installed = "$vcpkgRoot\installed\x64-windows"
          "INCLUDE=$env:INCLUDE;$installed\include" >> $env:GITHUB_ENV
          "LIB=$env:LIB;$installed\lib" >> $env:GITHUB_ENV
          "$installed\bin" >> $env:GITHUB_PATH
      - name: Configure compiler
        run: cmake -S strut -B strut/build -DSTRUT_WARNINGS_AS_ERRORS=ON
      - name: Build compiler
        run: cmake --build strut/build --config Release --parallel
      - name: Run regressions (POSIX)
        if: runner.os != 'Windows'
        run: python3 strut-regression-suite/runner.py --compiler strut/build/strut --jobs 2
      - name: Run regressions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # MSVC's default shared vc140.pdb is not safe across independent cl.exe
        # processes, so keep native fixture compilations serial on Windows.
        run: python strut-regression-suite/runner.py --compiler strut/build/Release/strut.exe --jobs 1
