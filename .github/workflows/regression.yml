name: regression
on:
  push:
  pull_request:
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: strut-labs/strut
          path: strut
      - uses: actions/checkout@v5
        with:
          path: suite
      - name: Enable MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure native dependencies (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcurl4-openssl-dev libsqlite3-dev
          echo "STRUT_CXXFLAGS=$(pkg-config --cflags libcurl)" >> "$GITHUB_ENV"
          echo "STRUT_LDFLAGS=$(pkg-config --libs libcurl)" >> "$GITHUB_ENV"
      - name: Configure native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install curl:x64-windows sqlite3:x64-windows
          $installed = "$env:VCPKG_ROOT\installed\x64-windows"
          "INCLUDE=$env:INCLUDE;$installed\include" >> $env:GITHUB_ENV
          "LIB=$env:LIB;$installed\lib" >> $env:GITHUB_ENV
          "$installed\bin" >> $env:GITHUB_PATH
      - name: Install current LLVM/libc++ (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "CXX=$LLVM_PREFIX/bin/clang++" >> "$GITHUB_ENV"
          echo "STRUT_CXXFLAGS=-nostdinc++ -isystem $LLVM_PREFIX/include/c++/v1 -D_LIBCPP_DISABLE_AVAILABILITY" >> "$GITHUB_ENV"
          echo "STRUT_LDFLAGS=-L$LLVM_PREFIX/lib/c++ -Wl,-rpath,$LLVM_PREFIX/lib/c++" >> "$GITHUB_ENV"
      - name: Configure Strut (non-macOS)
        if: runner.os != 'macOS'
        run: cmake -S strut -B strut/build -DCMAKE_BUILD_TYPE=Release
      - name: Configure Strut (macOS with current libc++)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          cmake -S strut -B strut/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DCMAKE_CXX_FLAGS="-nostdinc++ -isystem $LLVM_PREFIX/include/c++/v1 -D_LIBCPP_DISABLE_AVAILABILITY" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$LLVM_PREFIX/lib/c++ -Wl,-rpath,$LLVM_PREFIX/lib/c++"
      - name: Build Strut
        run: cmake --build strut/build --config Release
      - name: Run regression suite (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            LLVM_PREFIX="$(brew --prefix llvm)"
            DYLD_LIBRARY_PATH="$LLVM_PREFIX/lib/c++" python3 suite/runner.py --compiler strut/build/strut
          else
            python3 suite/runner.py --compiler strut/build/strut
          fi
      - name: Run regression suite (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python suite/runner.py --compiler strut/build/Release/strut.exe
