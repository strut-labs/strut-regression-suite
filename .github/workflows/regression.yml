name: regression
on:
  push:
  pull_request:
jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: strut-labs/strut
          path: strut
      - uses: actions/checkout@v4
        with:
          path: suite
      - name: Configure Strut
        run: cmake -S strut -B strut/build -DCMAKE_BUILD_TYPE=Release
      - name: Build Strut
        run: cmake --build strut/build --config Release
      - name: Run regression suite
        shell: bash
        run: |
          if [ -x strut/build/strut ]; then BIN=strut/build/strut; else BIN=strut/build/Release/strut.exe; fi
          python3 suite/runner.py --compiler "$BIN"
