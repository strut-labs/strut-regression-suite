name: regression
on:
  push:
  pull_request:
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: strut-labs/strut
          path: strut
      - uses: actions/checkout@v5
        with:
          path: suite
      - name: Enable MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure native dependencies (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libcurl4-openssl-dev libsqlite3-dev
          echo "STRUT_CXXFLAGS=$(pkg-config --cflags libcurl)" >> "$GITHUB_ENV"
          echo "STRUT_LDFLAGS=$(pkg-config --libs libcurl)" >> "$GITHUB_ENV"
      - name: Configure native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install curl:x64-windows sqlite3:x64-windows
          $installed = "$env:VCPKG_ROOT\installed\x64-windows"
          "INCLUDE=$env:INCLUDE;$installed\include" >> $env:GITHUB_ENV
          "LIB=$env:LIB;$installed\lib" >> $env:GITHUB_ENV
          "$installed\bin" >> $env:GITHUB_PATH
      - name: Configure Strut (non-macOS)
        if: runner.os != 'Windows'
        run: cmake -S strut -B strut/build -DCMAKE_BUILD_TYPE=Release
      - name: Configure Strut (Windows)
        if: runner.os == 'Windows'
        run: cmake -S strut -B strut/build -DCMAKE_BUILD_TYPE=Release
      - name: Build Strut
        run: cmake --build strut/build --config Release
      - name: Run regression suite (POSIX)
        if: runner.os != 'Windows'
        run: python3 suite/runner.py --compiler strut/build/strut
      - name: Run regression suite (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python suite/runner.py --compiler strut/build/Release/strut.exe
